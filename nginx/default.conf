# ─────────────────────────────────────────────────────────────────────────────
# nginx reverse proxy + load balancer for the Node app (Podman edition)
#
# This file is mounted into the nginx container at /etc/nginx/conf.d/default.conf
# via a ConfigMap (see k8s/nginx.yaml).
# ─────────────────────────────────────────────────────────────────────────────

# 1) UPSTREAM = the pool of backends nginx load-balances across.
#    Default algorithm is round-robin (request 1 -> a, request 2 -> b, ...).
#    We target Podman POD NAMES because k8s Service DNS ("node-web-service")
#    does NOT resolve under `podman kube play`. On real Kubernetes you'd instead
#    write a single `server node-web-service:8080;` and let the cluster balance.
upstream node_backends {
    server node-web-a-pod:8080;
    server node-web-b-pod:8080;
}

server {
    listen 80;

    location / {
        # Forward to the upstream pool (note: http://<upstream_name>).
        proxy_pass http://node_backends;

        # Show WHICH backend served this response, so load balancing is visible:
        #   curl -D - localhost:8082 | grep X-Upstream
        # The IP should alternate between the two backend pods.
        add_header X-Upstream $upstream_addr;

        # Standard proxy headers so the Node app sees the real client, not nginx.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
