apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data: # 🛠️ Fixed: Removed 'spec:' and put 'data:' right under metadata!
  prometheus.yml: |
    global:
      scrape_interval: 5s 
    scrape_configs:
      - job_name: 'node-app'
        static_configs:
          # Podman doesn't resolve k8s Service names, so target the pod names
          # directly — both backends, so Prometheus scrapes each one.
          - targets: ['node-web-a-pod:8080', 'node-web-b-pod:8080']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus/
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config